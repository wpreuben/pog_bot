[project]
name = "pog-engine"
version = "0.1.0"
description = "Paths of Glory Historical campaign rules engine"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pog_engine"]
